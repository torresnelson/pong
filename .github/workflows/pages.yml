name: Pong on GitHub Pages

# Run the unit tests, build the web version (Emscripten + raylib) and publish
# it to GitHub Pages. Nix provides the same toolchain as the local nix-shell.
# Requires Settings > Pages > Source: "GitHub Actions".

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Unit tests
        run: nix-shell --run 'make test'

      - name: Build web version
        run: nix-shell -p emscripten gnumake git --run 'make web'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
