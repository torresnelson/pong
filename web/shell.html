<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pong</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
         color: #8a8a99; font: 14px/1.5 ui-monospace, "DejaVu Sans Mono", Menlo, monospace; }
  /* Fit the 16:9 game inside the screen on any device, keeping its aspect ratio */
  canvas { display: block; width: auto; height: auto; max-width: 100vw; max-height: 100vh;
           max-height: 100dvh; outline: none; touch-action: none; user-select: none;
           -webkit-user-select: none; -webkit-touch-callout: none; }
  p { margin: 12px 16px 0; text-align: center; }
  #rotate { display: none; }
  /* Phones and tablets: keyboard hints do not apply, and the game wants landscape */
  @media (pointer: coarse) {
    #keys { display: none; }
    canvas { max-height: 100vh; max-height: 100dvh; }
  }
  @media (pointer: coarse) and (orientation: portrait) {
    #rotate { display: block; }
  }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<p id="rotate">Turn your phone sideways to play.</p>
<p id="keys">Menu: &uarr; / &darr; then Enter (or click) &middot; Player 1: W / S &middot; Player 2: &uarr; / &darr; &middot; Space: pause &middot; M: menu</p>
<script>
  var Module = {
    canvas: document.getElementById('canvas'),
    print: console.log,
    printErr: console.error,
    // Load index.wasm from the same build as this page; `make web` fills in the
    // version so a browser cache cannot pair a new page with an old game.
    locateFile: function (path, prefix) { return prefix + path + '?v=@WEB_VERSION@'; },
  };
  // Keep the game keys from scrolling the page.
  window.addEventListener('keydown', function (event) {
    if (['ArrowUp', 'ArrowDown', ' '].includes(event.key)) event.preventDefault();
  });
</script>
{{{ SCRIPT }}}
</body>
</html>
